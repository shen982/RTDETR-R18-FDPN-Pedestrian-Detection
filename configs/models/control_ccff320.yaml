# Capacity control derived from baseline_r18.yaml (AGPL-3.0).
# Keep R18, projection/AIFI (8--9), decoder hidden width and query count fixed.
# Only widen the original CCFF layers (10--25) from 256 to 320 channels.
# Selected by parameter proximity, never by validation/test accuracy.
nc: 80
scales:
  l: [1.00, 1.00, 1024]
backbone:
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, false, relu]]
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, false, relu]]
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, false, relu]]
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]]
  - [-1, 1, Blocks, [64, BasicBlock, 2, 2, relu]]
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, relu]]
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, relu]]
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, relu]]
head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, false]]
  - [-1, 1, AIFI, [1024, 8]]
  - [-1, 1, Conv, [320, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [6, 1, Conv, [320, 1, 1, None, 1, 1, false]]
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [320, 0.5]]
  - [-1, 1, Conv, [320, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [5, 1, Conv, [320, 1, 1, None, 1, 1, false]]
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [320, 0.5]]
  - [-1, 1, Conv, [320, 3, 2]]
  - [[-1, 15], 1, Concat, [1]]
  - [-1, 3, RepC3, [320, 0.5]]
  - [-1, 1, Conv, [320, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 3, RepC3, [320, 0.5]]
  - [[19, 22, 25], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]
